name: Private source cmix AMD frontier benchmark

on:
  push:
    paths:
      - "bundle/cmix-source-frontier-2m.tar.gz.enc"
      - ".github/workflows/source-frontier-2m.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-source-cmix-frontier
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out encrypted source bundle
        uses: actions/checkout@v5

      - name: Decrypt and verify private bundle
        env:
          CMIX_BUNDLE_KEY: ${{ secrets.CMIX_BUNDLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CMIX_BUNDLE_KEY"
          mkdir -p private
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in bundle/cmix-source-frontier-2m.tar.gz.enc \
            -out /tmp/cmix-source-frontier-2m.tar.gz \
            -pass env:CMIX_BUNDLE_KEY
          tar -xzf /tmp/cmix-source-frontier-2m.tar.gz -C private
          rm -f /tmp/cmix-source-frontier-2m.tar.gz
          (cd private && sha256sum -c SOURCE_SHA256SUMS >/dev/null)
          chmod 700 private/run_benchmark.sh
          echo "Encrypted source bundle verified."

      - name: Build fresh AMD PGO variants and benchmark
        id: private_run
        continue-on-error: true
        run: |
          set -euo pipefail
          cd private
          ./run_benchmark.sh

      - name: Show non-sensitive metrics
        if: always()
        run: |
          if test -f private/output/build_info.txt; then cat private/output/build_info.txt; fi
          if test -f private/output/binary_sha256.txt; then cat private/output/binary_sha256.txt; fi
          if test -f private/output/results.tsv; then cat private/output/results.tsv; fi

      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmix-source-frontier-2m-metrics
          path: |
            private/output/build_info.txt
            private/output/binary_sha256.txt
            private/output/results.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Encrypt private diagnostics
        if: always()
        env:
          CMIX_BUNDLE_KEY: ${{ secrets.CMIX_BUNDLE_KEY }}
        run: |
          set -euo pipefail
          if test -d private/output/logs; then
            tar -C private -czf /tmp/cmix-private-diagnostics.tar.gz output/logs output/build_info.txt 2>/dev/null || true
            if test -s /tmp/cmix-private-diagnostics.tar.gz; then
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                -in /tmp/cmix-private-diagnostics.tar.gz \
                -out cmix-private-diagnostics.tar.gz.enc \
                -pass env:CMIX_BUNDLE_KEY
            fi
          fi

      - name: Upload encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmix-private-diagnostics-encrypted
          path: cmix-private-diagnostics.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove decrypted material
        if: always()
        run: |
          rm -rf private /tmp/cmix-source-frontier-2m.tar.gz /tmp/cmix-private-diagnostics.tar.gz cmix-private-diagnostics.tar.gz.enc

      - name: Enforce benchmark success
        if: always()
        run: test "${{ steps.private_run.outcome }}" = "success"
